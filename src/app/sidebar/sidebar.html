<div class="card flex justify-center">
  <p-drawer [(visible)]="visible" header="{{ 'sidebar.header' | transloco }}">
    <div class="flex flex-col h-full">
      <ul class="list-none px-4 py-0 m-0">
        @for (item of items; track item.label) {
        <li class="rounded-lg overflow-hidden">
          <a
            pRipple
            class="flex items-center cursor-pointer p-4 gap-4 hover:bg-emerald-100"
          >
            <i [class]="item.icon + ' text-gray-500'"></i>
            <span class="font-medium"> {{ item.label }} </span>
          </a>
        </li>
        }
      </ul>
    </div>
  </p-drawer>
  <p-button (click)="visible = true" icon="pi pi-bars" />
</div>
