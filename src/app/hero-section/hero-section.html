<div class="hero-section min-h-screen text-white">
  <div class="px-6 py-10">
    <div class="space-y-6">
      <span class="py-2">Szia!</span>
      <h1 class="hero-heading">
        Hegedűs Péter vagyok,
        <span #typedText></span>.
      </h1>
      <p>Ez a weboldal az általam elkészített projekteket mutatja be.</p>

      <div class="flex gap-4">
        <p-button
          icon="pi pi-briefcase"
          severity="secondary"
          label="{{ 'portfolio' | transloco }}"
          [raised]="true"
        ></p-button>
        <p-button
          icon="pi pi-envelope"
          severity="secondary"
          label="{{ 'contact.me' | transloco }}"
          [raised]="true"
        ></p-button>
      </div>
    </div>

    <div>
      <p-avatar label="P" shape="circle" size="xlarge"></p-avatar>
    </div>
  </div>
</div>
