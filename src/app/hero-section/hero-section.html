<div class="hero-section min-h-screen text-white">
  <div class="px-6 pt-24 pb-10">
    <div class="space-y-3 sm:space-y-4 md:space-y-6">
      <h1 class="text-lg sm:text-xl md:text-2xl lg:text-3xl xl:text-4xl font-bold">Szia!</h1>
      <h1 class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl xl:text-6xl hero-heading leading-snug">
        Hegedűs Péter vagyok,
        <span class="block">
          <span class="typed-element"></span>
        </span>
      </h1>
      <p class="text-base sm:text-lg md:text-lg lg:text-xl">Ez a weboldal az általam elkészített projekteket mutatja be.</p>

      <div class="flex gap-4">
        <p-button
          icon="pi pi-briefcase"
          label="{{ 'portfolio' | transloco }}"
          [raised]="true"
        ></p-button>
        <p-button
          icon="pi pi-envelope"
          severity="secondary"
          label="{{ 'contact.me' | transloco }}"
          [raised]="true"
        ></p-button>
      </div>
    </div>

    <div>
      <p-avatar label="P" shape="circle" size="xlarge"></p-avatar>
    </div>
  </div>
</div>
