<p-select
  [options]="langs"
  [ngModel]="selectedLang()"
  (ngModelChange)="changeLang($event)"
  optionLabel="name"
  optionValue="code"
>
  <ng-template #selectedItem #item let-lang>
    <div class="flex items-center gap-2">
      <span class="fi fi-{{ lang.flag }}"></span>
      <span>{{ lang.name }}</span>
    </div>
  </ng-template>
</p-select>
